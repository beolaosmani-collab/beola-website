name: Build site

# Rebuilds the static pages whenever the SOURCE content changes.
# The owner can edit data/site.mjs on GitHub and the site republishes itself.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "content/**"
      - "build.mjs"
      - "css/**"
      - "js/**"
      - "images/**"
      - "favicon.svg"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Regenerate WebP copies of any photos (so image swaps stay fast).
      - name: Generate WebP
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          for f in glob.glob("images/*.jpg"):
              Image.open(f).convert("RGB").save(f[:-4] + ".webp", "WEBP", quality=80, method=6)
          print("WebP regenerated")
          PY

      - name: Build pages
        run: node build.mjs

      - name: Commit generated output
        run: |
          git config user.name "beola-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: rebuild site [skip ci]"
            git push
          fi
